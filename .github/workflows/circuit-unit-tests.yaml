name: Circuit Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "doc-site/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "doc-site/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

jobs:
  circuit-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install circom
        uses: supplypike/setup-bin@8365380a806a88e7a0f0d07059b175ca2f5418d7 # v5.0.1
        with:
          uri: https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          name: circom
          version: 2.2.3

      - name: Checkout circuits
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install circuit dependencies
        working-directory: zkp/circuits
        run: |
          npm install

      # Pinned, like circom above and every action in this file. The gate reads
      # circomspect's own output, so a release that rewords it would change what
      # the gate enforces. circomspect has no --version flag, so the version can
      # only be fixed at the install site.
      - name: Cache circomspect
        id: cache-circomspect
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/circomspect
          key: circomspect-${{ runner.os }}-0.9.0

      - name: Install circomspect
        if: steps.cache-circomspect.outputs.cache-hit != 'true'
        run: cargo install circomspect --locked --version 0.9.0

      - name: Check circomspect coverage
        run: ./zkp/circuits/scripts/circomspect-coverage.sh

      - name: Run circuit unit tests
        working-directory: zkp/js
        run: |
          npm install
          npm t
